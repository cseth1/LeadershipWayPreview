<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leadership Hub redirect</title>
  <meta id="page-redirect" http-equiv="refresh" content="0; url=./Aggie_Leadership_Website%202/dist/index.html">
  <script>
    const basePath = (() => {
      if (!window.location.hostname.endsWith('.github.io')) return '/';
      const segments = window.location.pathname.split('/').filter(Boolean);
      return segments.length ? `/${segments[0]}/` : '/';
    })();
    const target = new URL(`${basePath}Aggie_Leadership_Website%202/dist/index.html`, window.location.origin);
    target.search = window.location.search;
    target.hash = window.location.hash;
    document.getElementById('page-redirect').content = `0; url=${target.toString()}`;
    window.location.replace(target.toString());
  </script>
</head>
<body>
  <p>Redirecting to <a id="site-link" href="./Aggie_Leadership_Website%202/dist/index.html">the Leadership Hub</a>.</p>
  <script>
    document.getElementById('site-link').href = target.toString();
  </script>
</body>
</html>
