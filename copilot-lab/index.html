<title>HROE Copilot Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: maroon top bar; home = path of 12 weeks; lesson = step rail + one card at a time; Copilot window mock is the signature element */
/* single light theme by design: white, neutral greys, Aggie maroon as the one accent */
:root{
  color-scheme:light;
  --brand:#500000; --brand-ink:#ffffff; --btn:#500000; --btn-ink:#ffffff;
  --header:#ffffff; --header-ink:#500000;
  --bg:#fafafa; --surface:#ffffff; --sunk:#f3f3f4; --ink:#1d1d1f; --muted:#5d6067; --line:#e3e3e6;
  --accent:#500000; --accent-soft:#f6eeee;
  --good:#2b6a44; --good-soft:#e7f3eb; --bad:#a1281c; --bad-soft:#fbeae7; --gold:#8a6d2f;
  --cp-bg:#fafafa; --cp-user:#f0f0f2;
  --display:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Work Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--header);color:var(--header-ink);border-top:4px solid var(--brand);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brandmark{display:flex;flex-direction:column;text-decoration:none;color:inherit;margin-right:auto}
.brandmark b{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.brandmark span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:6px}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.open-cp{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:var(--brand-ink);text-decoration:none;font-weight:600;font-size:13px;padding:8px 14px;border-radius:999px}

main{padding-block:32px 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.01em;line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,6vw,54px);color:var(--accent)}
h2{font-size:clamp(24px,3.4vw,30px)}
h3{font-size:20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:18px;color:var(--muted);max-width:62ch;margin:12px 0 0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;padding:11px 18px;border-radius:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{padding:7px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.going{background:var(--accent-soft);color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap}

/* home */
.hero-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:28px}
.next{background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:12px}
.next h2{font-size:clamp(28px,4vw,38px);color:inherit}
.next .eyebrow{color:inherit;opacity:.75}
.next p{margin:0;opacity:.85;max-width:46ch}
.next .btn{background:var(--brand-ink);color:#500000;align-self:flex-start;margin-top:8px}
.statcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;gap:20px;align-items:center}
.ring{flex:none;width:104px;height:104px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:6px}
.tcard b{font-size:18px}
.tcard p{margin:0;color:var(--muted);font-size:15px}
.bring{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.bcard{border-top:3px solid var(--accent);background:var(--surface);border-radius:0 0 10px 10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 0 0 1px var(--line)}
.bcard span{font-size:14px;color:var(--muted)}
@media (max-width:860px){.trio{grid-template-columns:1fr}.bring{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.bring{grid-template-columns:1fr}}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:h}
.how li{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:12px;counter-increment:h}
.how li::before{content:counter(h);grid-row:span 2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
.how b{font-size:15px}
.how span{font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;font-variant-numeric:tabular-nums}
.stats b{display:block;font-family:var(--display);font-size:26px;font-weight:600;line-height:1}
.stats span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.path{margin-top:44px}
.path-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.weeks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:border-color .15s}
.wk:hover{border-color:var(--accent)}
.wk-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wk-num{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wk h3{font-size:22px}
.wk p{margin:0;color:var(--muted);font-size:14px}
.wk .bar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:auto}
.wk .bar i{display:block;height:100%;background:var(--accent)}
.phase2{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 22px;border-radius:12px;border:1px dashed var(--line);background:var(--sunk);text-decoration:none;color:inherit}
.phase2 h3{font-size:20px}
.phase2 p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:60ch}

/* lesson */
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.lesson-head{margin:10px 0 24px;display:flex;flex-direction:column;gap:10px}
.lesson-head .sub{font-size:18px;color:var(--muted);margin:0}
.lesson{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.rail button{width:100%;text-align:left;background:none;border:0;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--muted)}
.rail button:hover{background:var(--sunk)}
.rail .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;box-shadow:inset 0 0 0 1.5px var(--line);font-variant-numeric:tabular-nums}
.rail .seen .dot{background:var(--accent-soft);box-shadow:none;color:var(--accent)}
.rail .cur button{color:var(--ink);font-weight:600;background:var(--sunk)}
.rail .cur .dot{background:var(--btn);color:var(--btn-ink);box-shadow:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,3.5vw,36px);min-width:0}
.card .stepno{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.card h2{margin:6px 0 18px}
.card p{max-width:65ch;margin:0 0 14px}
.card .big{font-size:19px;line-height:1.5}
.points{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:12px;max-width:68ch}
.points li{padding-left:18px;position:relative}
.points li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.callout{border-left:3px solid var(--gold);background:var(--sunk);padding:14px 18px;border-radius:0 10px 10px 0;max-width:68ch}
.callout .eyebrow{color:var(--gold);margin-bottom:4px}
.callout p{margin:0}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.navrow .hint{font-size:13px;color:var(--muted)}

/* copilot window mock */
.cp{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--cp-bg);max-width:720px}
.cp-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.cp-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.cp-mark{width:18px;height:18px;border-radius:5px;background:conic-gradient(from 200deg,#7a1f2b,#c0525f,#d9a441,#7a1f2b)}
.cp-toggle{display:flex;background:var(--sunk);border-radius:999px;padding:3px;font-size:12px;font-weight:600}
.cp-toggle span{padding:3px 12px;border-radius:999px;color:var(--muted)}
.cp-toggle .on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.cp-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;font-size:15px}
.msg.user{align-self:flex-end;background:var(--cp-user);padding:12px 14px;border-radius:14px 14px 4px 14px}
.msg.bot{align-self:flex-start}
.msg.bot p{margin:0 0 10px}
.msg.bot ol,.msg.bot ul{margin:0 0 10px;padding-left:22px}
.msg.bot li{margin-bottom:6px}
.cite{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;margin-left:3px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;vertical-align:1px}
.cp-foot{padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cfg{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:14px;margin:0}
.cfg dt{color:var(--muted);font-weight:600}
.cfg dd{margin:0}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.note{border-top:2px solid var(--accent);padding-top:10px;font-size:14px}
.note b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}

/* activities */
.act-q{font-weight:600;margin:0 0 4px}
.act-help{font-size:13px;color:var(--muted);margin:0 0 16px}
.sort{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.srow .txt{flex:1 1 260px;min-width:0}
.srow .why{flex-basis:100%;font-size:13px;margin:0}
.srow.right{border-color:var(--good);background:var(--good-soft)}
.srow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.order li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.order .n{font-family:var(--display);font-size:18px;color:var(--muted);width:20px;text-align:center;font-variant-numeric:tabular-nums}
.order .txt{flex:1;min-width:0}
.order li.right{border-color:var(--good);background:var(--good-soft)}
.order li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mv{display:flex;gap:4px}
.mv button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px}
.result{margin-top:14px;font-weight:600}
.result.ok{color:var(--good)} .result.no{color:var(--bad)}
.scen{display:flex;flex-direction:column;gap:22px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-size:14px;margin:8px 0 0;padding-left:12px;border-left:2px solid var(--line)}

/* prompt builder */
.compare{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px;margin-bottom:20px}
.pbox{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--sunk);min-width:0}
.pbox .eyebrow{margin-bottom:6px}
.pbox.strong{border-color:var(--accent)}
.pbox .eyebrow.s{color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;font:inherit;font-size:15px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.prompt{font-family:var(--mono);font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;background:var(--cp-bg);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0}
.prompt mark{background:var(--accent-soft);color:var(--accent);padding:0 2px;border-radius:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.toast{font-size:13px;color:var(--good);font-weight:600}
.follow{margin-top:20px}
.follow ul{list-style:none;padding:0;margin:8px 0 0;display:flex;gap:8px;flex-wrap:wrap}
.follow li{font-family:var(--mono);font-size:13px;background:var(--sunk);border:1px solid var(--line);padding:6px 10px;border-radius:8px}

.takeaway{font-family:var(--display);font-weight:500;font-size:clamp(24px,3.4vw,32px);line-height:1.2;color:var(--accent);max-width:28ch;margin:0 0 18px;text-wrap:balance}

/* challenge */
.chal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.check li{display:flex;gap:10px;align-items:flex-start}
.check li::before{content:"";flex:none;width:16px;height:16px;margin-top:4px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--accent)}
.handed{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--good-soft);color:var(--good);font-weight:600}

/* tables & pages */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
.lib{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.libitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.libitem header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rules{list-style:none;padding:0;margin:24px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;counter-reset:r}
.rules li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 20px 20px 64px;position:relative;counter-increment:r}
.rules li::before{content:counter(r);position:absolute;left:20px;top:16px;font-family:var(--display);font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.rules b{display:block;margin-bottom:4px}
.rules p{margin:0;color:var(--muted);font-size:15px}
.conf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.conf .field{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.conf input[type=range]{width:100%;accent-color:var(--btn)}
.conf output{font-family:var(--display);font-size:26px;font-weight:600}
.section{margin-top:40px}
footer{border-top:1px solid var(--line);padding-block:20px;font-size:13px;color:var(--muted)}

@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .weeks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lesson{grid-template-columns:1fr;gap:16px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .rail li{flex:none}
  .rail button{padding:6px 10px;white-space:nowrap}
  .rail .lbl{display:none}
  .rail .cur .lbl{display:inline}
  .chal,.compare,.rules,.conf{grid-template-columns:1fr}
}
@media (max-width:520px){
  .weeks{grid-template-columns:1fr}
  .statcard{flex-direction:column;align-items:flex-start}
  .nav a{padding:6px 7px;font-size:12px}
  .cfg{grid-template-columns:1fr}
  .top{position:static}
  .navrow .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <a class="brandmark" href="#home"><b>HROE Copilot Lab</b><span>Texas A&amp;M University · HROE</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#home" data-r="home">Weeks</a>
      <a href="#library" data-r="library">Prompts</a>
      <a href="#rules" data-r="rules">HR data rules</a>
    </nav>
    <a class="open-cp" href="https://m365.cloud.microsoft/chat" target="_blank" rel="noopener">Open Copilot ↗</a>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">HROE Copilot Lab · Share what you try in the cohort's Teams channel. Ask questions, help each other, and borrow good ideas.</div></footer>

<script>
const COPILOT = 'https://m365.cloud.microsoft/chat';
const STEPS = ['Why this matters','The idea','See it work','Your turn','Try it in Copilot','Take this with you','Check what stuck','Try it and share'];

const WEEKS = [
{n:1, title:'Catch me up', sub:'Your week in one answer', mins:15, tags:['Work vs. web','Checking sources','HR data rules'],
 why:[`You come back from two days out. A full inbox, three meetings you missed, and a Teams thread that moved on without you.`,
      `Most people spend the first hour just finding out what happened. Copilot can do that hour in about a minute, because it can read your email, chats and meetings for you.`],
 idea:{points:[
   ['Two modes: Work and Web.','Work mode reads your own email, Teams chats, meetings and files. Web mode searches the internet. For "what happened this week," use Work.'],
   ['It sees what you can see.','Copilot uses your permissions. It never opens a coworker’s inbox or a folder you can’t open yourself.'],
   ['Good answers come with links.','Each item should link back to the email, chat or meeting it came from. Those links are how you check it.'],
   ['You are the final check.','It can miss a message or misread a thread. Skim the links before you act on anything important.']],

/* ---------- state ---------- */
/* lesson position is kept only while the page is open; nothing is tracked or saved */
const S={weeks:{}};
function save(){}
function W(n){if(!S.weeks[n]) S.weeks[n]={step:0,seen:[]}; return S.weeks[n];}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app');
let act={};

function copyText(text,btn){
  const done=()=>{const t=btn.parentElement.querySelector('.toast'); if(t){t.textContent='Copied'; setTimeout(()=>t.textContent='',1800);}};
  const fallback=()=>{const pre=btn.closest('[data-copywrap]')?.querySelector('.prompt'); if(pre){const r=document.createRange(); r.selectNodeContents(pre); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);} const t=btn.parentElement.querySelector('.toast'); if(t) t.textContent='Selected. Press Ctrl+C or Cmd+C to copy.';};
  try{navigator.clipboard.writeText(text).then(done,fallback);}catch(e){fallback();}
}

/* ---------- routing ---------- */
function route(){
  const h=(location.hash||'#home').slice(1);
  document.querySelectorAll('.nav a').forEach(a=>{const r=a.dataset.r; const on=(r==='home'&&(h==='home'||h.startsWith('week-')||h==='next-six'))||r===h; on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');});
  const m=h.match(/^week-([1-6])$/);
  if(m) renderLesson(+m[1]);
  else if(h==='library') renderLibrary();
  else if(h==='rules') renderRules();
  else if(h==='next-six') renderNextSix();
  else renderHome();
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);

/* ---------- home ---------- */
function renderHome(){
  const nextCard=`<div class="next"><span class="eyebrow">Start here · Week 1</span><h2>${esc(WEEKS[0].title)}</h2><p>${esc(WEEKS[0].sub)}. About ${WEEKS[0].mins} minutes, then try it on your own work.</p><a class="btn" href="#week-1">Start lesson</a></div>`;
  const how=[['Do the lesson','About 15 minutes, any time that week.'],['Try it on your work','Use the practice prompt in Copilot.'],['Share it in Teams','Post what you tried in the week’s thread.'],['Learn from each other','See what others tried, ask questions, help out.']];
  app.innerHTML=`
  <span class="eyebrow">Microsoft 365 Copilot · 12-week HROE pilot</span>
  <h1 style="margin-top:8px">Learn Copilot by doing your real work</h1>
  <p class="lead">One HR task a week for six weeks. Each lesson takes about 15 minutes. Then you try it on your own work and share what you tried in Teams.</p>
  <div class="hero-grid">${nextCard}
    <div class="statcard" style="flex-direction:column;align-items:stretch;gap:14px"><span class="eyebrow">How each week works</span>
      <ol class="how">${how.map(([b,t])=>`<li><b>${esc(b)}</b><span>${esc(t)}</span></li>`).join('')}</ol>
    </div>
  </div>
  <section class="path">
    <div class="path-head"><div><span class="eyebrow">Weeks 1–6</span><h2>One use case a week</h2></div><span class="muted" style="font-size:14px">Each week builds toward building your own agent in Week 6.</span></div>
    <div class="weeks">${WEEKS.map(w=>`<a class="wk" href="#week-${w.n}"><div class="wk-top"><span class="wk-num">Week ${w.n} · ~${w.mins} min</span><span class="pill going">${esc(w.chal.name)}</span></div><h3>${esc(w.title)}</h3><p>${esc(w.sub)}</p><div class="tags">${w.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></a>`).join('')}</div>
    <a class="phase2" href="#next-six"><div><span class="eyebrow">Weeks 7–12</span><h3>Use it, then show us</h3><p>Use Copilot on your real work and bring something to share at a 30-minute showcase every other week.</p></div><span class="btn ghost small">How showcases work</span></a>
  </section>`;
}

/* ---------- lesson ---------- */
function renderLesson(n){
  const wk=WEEKS[n-1], w=W(n);
  if(!w.seen.includes(w.step)){w.seen.push(w.step); save();}
  act={};
  app.innerHTML=`
  <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">Your path</a><span>/</span><span>Week ${n}</span></nav>
  <div class="lesson-head"><h1>${esc(wk.title)}</h1><p class="sub">${esc(wk.sub)}</p><div class="tags"><span class="pill">~${wk.mins} min</span>${wk.tags.map(t=>`<span class="pill going">${esc(t)}</span>`).join('')}</div></div>
  <div class="lesson">
    <ol class="rail">${STEPS.map((s,i)=>`<li class="${i===w.step?'cur':''} ${w.seen.includes(i)?'seen':''}"><button data-go="${i}"><span class="dot">${w.seen.includes(i)&&i!==w.step?'✓':i+1}</span><span class="lbl">${s}</span></button></li>`).join('')}</ol>
    <div><article class="card" id="card">${stepBody(wk,w)}</article>
      <div class="navrow"><button class="btn ghost" data-nav="-1" ${w.step===0?'disabled':''}>Back</button><span class="hint">Use ← and → to move</span>${w.step<STEPS.length-1?`<button class="btn" data-nav="1">Next</button>`:(n<6?`<a class="btn" href="#week-${n+1}">Go to Week ${n+1}</a>`:`<a class="btn" href="#next-six">Weeks 7–12</a>`)}</div>
    </div>
  </div>`;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{w.step=+b.dataset.go; save(); renderLesson(n);});
  app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{w.step=Math.max(0,Math.min(STEPS.length-1,w.step+ +b.dataset.nav)); save(); renderLesson(n); document.getElementById('card').scrollIntoView({block:'nearest'});});
  wireStep(wk,w);
}
document.addEventListener('keydown',e=>{
  if(!location.hash.startsWith('#week-')||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight') document.querySelector('[data-nav="1"]')?.click();
  if(e.key==='ArrowLeft') document.querySelector('[data-nav="-1"]')?.click();
});

function head(i){return `<div class="stepno">Step ${i+1} of ${STEPS.length}</div><h2>${STEPS[i]}</h2>`;}
function cpWindow(see){
  return `<div class="cp"><div class="cp-bar"><span class="cp-name"><span class="cp-mark" aria-hidden="true"></span>Microsoft 365 Copilot</span><span class="cp-toggle" aria-label="Mode: ${see.mode}"><span class="${see.mode==='Work'?'on':''}">Work</span><span class="${see.mode==='Web'?'on':''}">Web</span></span></div>
  <div class="cp-body"><div class="msg user">${esc(see.prompt)}</div><div class="msg bot">${see.cfg?'<p class="muted" style="font-size:13px;margin-bottom:8px">Agent Builder filled in the Configure tab:</p>':''}${see.resp}</div></div>
  <div class="cp-foot"><span>Example response, written for this lesson</span><span>Numbered links point back to sources</span></div></div>`;
}
function fillTemplate(t,vals,mark){return t.replace(/\{(\w+)\}/g,(_,k)=>{const v=(vals[k]??'').trim(); return mark? (v?`<mark>${esc(v)}</mark>`:'') : v;}).replace(/\s+$/,'');}

function stepBody(wk,w){
  const i=w.step;
  switch(i){
  case 0: return head(i)+wk.why.map((p,k)=>`<p class="${k===0?'big':''}">${esc(p)}</p>`).join('');
  case 1: return head(i)+`<ul class="points">${wk.idea.points.map(([b,t])=>`<li><b>${esc(b)}</b> ${esc(t)}</li>`).join('')}</ul><div class="callout"><div class="eyebrow">${esc(wk.idea.callout[0])}</div><p>${esc(wk.idea.callout[1])}</p></div>`;
  case 2: return head(i)+cpWindow(wk.see)+`<div class="notes">${wk.see.notes.map(([b,t])=>`<div class="note"><b>${esc(b)}</b>${esc(t)}</div>`).join('')}</div>`;
  case 3: return head(i)+activity(wk.act);
  case 4: return head(i)+tryIt(wk);
  case 5: return head(i)+`<p class="takeaway">${esc(wk.take)}</p><p class="muted">Keep this one line in mind this week. You’ll use it in the challenge.</p>`;
  case 6: return head(i)+quiz(wk,w);
  case 7: return head(i)+challenge(wk,w);
  }
}

function activity(a){
  if(a.type==='sort'){
    act.place=a.cards.map(()=>null);
    return `<p class="act-q">${esc(a.q)}</p><p class="act-help">${esc(a.help)}</p><div class="sort">${a.cards.map((c,ci)=>`<div class="srow" data-ci="${ci}"><span class="txt">${esc(c[0])}</span><span class="chips">${a.buckets.map((b,bi)=>`<button class="chip" aria-pressed="false" data-ci="${ci}" data-bi="${bi}">${esc(b)}</button>`).join('')}</span><p class="why" hidden></p></div>`).join('')}</div><div class="actions"><button class="btn" id="chk">Check answers</button><button class="btn ghost" id="rst">Reset</button></div><p class="result" id="res" aria-live="polite"></p>`;
  }
  if(a.type==='order'){
    act.order=a.items.map((_,k)=>k); for(let k=act.order.length-1;k>0;k--){const j=(k*7+3)%(k+1); [act.order[k],act.order[j]]=[act.order[j],act.order[k]];}
    if(act.order.every((v,k)=>v===k)) act.order.reverse();
    return `<p class="act-q">${esc(a.q)}</p><p class="act-help">${esc(a.help)}</p><ol class="order" id="ord"></ol><div class="actions"><button class="btn" id="chk">Check order</button></div><p class="result" id="res" aria-live="polite"></p>`;
  }
  if(a.type==='scen'){
    return `<p class="act-q">${esc(a.q)}</p><p class="act-help">Pick the best option for each.</p><div class="scen">${a.items.map((s,si)=>`<div><b>${esc(s.q)}</b><div class="opts">${s.o.map((o,oi)=>`<button class="opt" data-si="${si}" data-oi="${oi}">${esc(o)}</button>`).join('')}</div><p class="fb" data-fb="${si}" hidden></p></div>`).join('')}</div>`;
  }
}
function drawOrder(a){
  const ol=document.getElementById('ord');
  ol.innerHTML=act.order.map((it,pos)=>`<li data-pos="${pos}"><span class="n">${pos+1}</span><span class="txt">${esc(a.items[it])}</span><span class="mv"><button aria-label="Move up" data-up="${pos}" ${pos===0?'disabled':''}>↑</button><button aria-label="Move down" data-dn="${pos}" ${pos===act.order.length-1?'disabled':''}>↓</button></span></li>`).join('');
  ol.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const p=+b.dataset.up; [act.order[p-1],act.order[p]]=[act.order[p],act.order[p-1]]; drawOrder(a); document.getElementById('res').textContent='';});
  ol.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const p=+b.dataset.dn; [act.order[p+1],act.order[p]]=[act.order[p],act.order[p+1]]; drawOrder(a); document.getElementById('res').textContent='';});
}

function tryIt(wk){
  const t=wk.tryit; act.vals={};
  for(const [k,f] of Object.entries(t.fields)) act.vals[k]=f.type==='select'?f.options[0]:f.value;
  return `<div class="compare"><div class="pbox"><div class="eyebrow">Weaker</div><div class="prompt" style="background:transparent;border:0;padding:0">${esc(t.weak)}</div></div><div class="pbox strong"><div class="eyebrow s">Stronger: build yours below</div><p style="margin:0;font-size:14px" class="muted">Fill in the blanks with your real work, copy the prompt, and run it in Copilot (Work mode).</p></div></div>
  <div class="fields">${Object.entries(t.fields).map(([k,f])=>`<div class="field"><label for="f-${wk.n}-${k}">${esc(f.label)}</label>${f.type==='select'?`<select id="f-${wk.n}-${k}" data-k="${k}">${f.options.map(o=>`<option value="${esc(o)}">${o?esc(o):'(none)'}</option>`).join('')}</select>`:`<input id="f-${wk.n}-${k}" data-k="${k}" value="${esc(f.value)}">`}</div>`).join('')}</div>
  <div data-copywrap><pre class="prompt" id="pv">${fillTemplate(t.template,act.vals,true)}</pre>
  <div class="actions"><button class="btn" id="cpy">Copy prompt</button><a class="btn ghost" href="${COPILOT}" target="_blank" rel="noopener">Open Copilot ↗</a><span class="toast" aria-live="polite"></span></div></div>
  ${t.follow?`<div class="follow"><span class="eyebrow">Then ask again</span><ul>${t.follow.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`:''}`;
}

function quiz(wk,w){
  return `<p class="muted" style="margin-bottom:18px">These test the skill, not the wording. Answer from what you just practiced.</p><div class="scen">${wk.quiz.map((q,qi)=>`<div><b>${qi+1}. ${esc(q.q)}</b><div class="opts">${q.o.map((o,oi)=>`<button class="opt" data-qi="${qi}" data-oi="${oi}">${esc(o)}</button>`).join('')}</div><p class="fb" data-qfb="${qi}" hidden></p></div>`).join('')}</div><p class="result" id="qres" aria-live="polite"></p>`;
}

function challenge(wk,w){
  const c=wk.chal;
  return `<div class="chal"><div><span class="eyebrow">Try it on your work</span><h3 style="margin:6px 0 10px;font-size:26px">${esc(c.name)}</h3><p>${esc(c.task)}</p><span class="eyebrow">What to share</span><ul class="check" style="margin-top:8px">${c.handin.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div>
  <div data-copywrap><span class="eyebrow">Sharing template (optional)</span><pre class="prompt" style="margin-top:8px">${esc(c.tpl)}</pre><div class="actions"><button class="btn ghost small" id="cpt">Copy template</button><span class="toast" aria-live="polite"></span></div></div></div>
  <div class="handed" style="background:var(--accent-soft);color:var(--ink);font-weight:500">Post what you tried in the <b>&nbsp;Week ${wk.n}&nbsp;</b> thread of the cohort’s Teams channel. It’s a place to share, ask for help, and see how others used it.</div>`;
}

function wireStep(wk,w){
  const i=w.step, n=wk.n;
  if(i===3){
    const a=wk.act;
    if(a.type==='sort'){
      app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const ci=+b.dataset.ci,bi=+b.dataset.bi; act.place[ci]=bi; app.querySelectorAll(`.chip[data-ci="${ci}"]`).forEach(x=>x.setAttribute('aria-pressed',+x.dataset.bi===bi)); const row=app.querySelector(`.srow[data-ci="${ci}"]`); row.classList.remove('right','wrong'); row.querySelector('.why').hidden=true;});
      document.getElementById('chk').onclick=()=>{
        const res=document.getElementById('res'); if(act.place.some(p=>p===null)){res.className='result no'; res.textContent=`Place all ${a.cards.length} first.`; return;}
        let ok=0; a.cards.forEach((c,ci)=>{const row=app.querySelector(`.srow[data-ci="${ci}"]`); const r=act.place[ci]===c[1]; ok+=r; row.classList.toggle('right',r); row.classList.toggle('wrong',!r); const why=row.querySelector('.why'); why.textContent=(r?'':`Best fit: ${a.buckets[c[1]]}. `)+c[2]; why.hidden=false;});
        res.className='result '+(ok===a.cards.length?'ok':'no'); res.textContent=`${ok} of ${a.cards.length} right.${ok===a.cards.length?' Nice work.':' Read the notes, then try again.'}`;};
      document.getElementById('rst').onclick=()=>renderLesson(n);
    }
    if(a.type==='order'){
      drawOrder(a);
      document.getElementById('chk').onclick=()=>{let ok=0; app.querySelectorAll('#ord li').forEach((li,pos)=>{const r=act.order[pos]===pos; ok+=r; li.classList.toggle('right',r); li.classList.toggle('wrong',!r);}); const res=document.getElementById('res'); res.className='result '+(ok===a.items.length?'ok':'no'); res.textContent=ok===a.items.length?'That’s the order. Prep, ask, recap, check, send.':`${ok} of ${a.items.length} in the right spot. Move the red ones and check again.`;};
    }
    if(a.type==='scen'){
      app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const si=+b.dataset.si,oi=+b.dataset.oi,s=a.items[si]; app.querySelectorAll(`.opt[data-si="${si}"]`).forEach(x=>x.classList.remove('right','wrong')); b.classList.add(oi===s.a?'right':'wrong'); const fb=app.querySelector(`[data-fb="${si}"]`); fb.textContent=(oi===s.a?'Right. ':'Not quite. ')+s.why; fb.hidden=false;});
    }
  }
  if(i===4){
    const t=wk.tryit, pv=document.getElementById('pv');
    app.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{act.vals[el.dataset.k]=el.value; pv.innerHTML=fillTemplate(t.template,act.vals,true);}));
    document.getElementById('cpy').onclick=e=>copyText(fillTemplate(t.template,act.vals,false),e.currentTarget);
  }
  if(i===6){
    const first={};
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const qi=+b.dataset.qi,oi=+b.dataset.oi,q=wk.quiz[qi];
      if(!(qi in first)) first[qi]=oi===q.a;
      app.querySelectorAll(`.opt[data-qi="${qi}"]`).forEach(x=>x.classList.remove('right','wrong')); b.classList.add(oi===q.a?'right':'wrong');
      const fb=app.querySelector(`[data-qfb="${qi}"]`); fb.textContent=(oi===q.a?'Right. ':'Not quite. ')+q.why; fb.hidden=false;
      if(Object.keys(first).length===wk.quiz.length){const score=Object.values(first).filter(Boolean).length; w.quiz=score; save(); document.getElementById('qres').textContent=`${score} of ${wk.quiz.length} on the first try.`; document.getElementById('qres').className='result '+(score===wk.quiz.length?'ok':'');}
    });
  }
  if(i===7){
    document.getElementById('cpt').onclick=e=>copyText(wk.chal.tpl,e.currentTarget);
    const h=document.getElementById('hand'); if(h) h.onclick=()=>{w.handed=true; save(); renderLesson(n);};
    const u=document.getElementById('unhand'); if(u) u.onclick=()=>{w.handed=false; save(); renderLesson(n);};
  }
}

/* ---------- other pages ---------- */
function renderLibrary(){
  app.innerHTML=`<span class="eyebrow">Prompt library</span><h1 style="margin-top:8px">Prompts that work</h1><p class="lead">Every practice prompt from the six lessons, ready to copy. Replace the highlighted parts with your own work.</p>
  <div class="lib">${WEEKS.map(wk=>{const t=wk.tryit; const vals={}; for(const [k,f] of Object.entries(t.fields)) vals[k]=f.type==='select'?f.options[0]:f.value; return `<div class="libitem" data-copywrap><header><div><span class="eyebrow">Week ${wk.n}</span><h3>${esc(wk.title)}</h3></div><a class="btn ghost small" href="#week-${wk.n}">Open lesson</a></header><pre class="prompt">${fillTemplate(t.template,vals,true)}</pre><div class="actions"><button class="btn small" data-copy="${wk.n}">Copy</button><span class="toast" aria-live="polite"></span></div></div>`;}).join('')}</div>`;
  app.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const wk=WEEKS[+b.dataset.copy-1],t=wk.tryit,vals={}; for(const [k,f] of Object.entries(t.fields)) vals[k]=f.type==='select'?f.options[0]:f.value; copyText(fillTemplate(t.template,vals,false),b);});
}

  <h1 style="margin-top:10px">Use it, then show us</h1><p class="lead">The lessons are done. For the next six weeks, use Copilot on your real work, any way that helps. Every other week, we get together for 30 minutes and show each other what we made.</p>

    <div class="tcard"><span class="eyebrow">Along the way</span><b>The HROE library grows</b><p>Facilitators turn the best showcase ideas into prompts anyone in HROE can copy.</p></div>
  </div>
  <div class="section"><h2 style="margin-bottom:6px">What to bring</h2><p class="muted" style="margin:0 0 14px">Just one. A quick screenshot or a copied prompt is plenty.</p>
    <div class="bring">${[['A prompt that saved you time','Paste it in the chat so others can copy it.'],['Something you made','A draft email, a recap, a deck, a chart.'],['An agent you built','Show it answering one real question.'],['Something that didn’t work','These teach the group the most.']].map(([b,t])=>`<div class="bcard"><b>${esc(b)}</b><span>${esc(t)}</span></div>`).join('')}</div>
  </div>

  <div class="section"><div class="phase2" style="cursor:default"><div><span class="eyebrow">Where this goes</span><h3>Your showcases shape the rollout</h3><p>What the cohort shows becomes the story for leadership: the best uses, the agents worth sharing, and what HROE needs before more people get Copilot.</p></div></div></div>`;

route();
