<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leadership Hub redirect</title>
  <meta http-equiv="refresh" content="0; url=./dist/index.html">
  <script>
    const target = new URL('./dist/index.html', window.location.href);
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.toString());
  </script>
</head>
<body>
  <p>Redirecting to <a id="site-link" href="./dist/index.html">the Leadership Hub</a>.</p>
  <script>
    document.getElementById('site-link').href = new URL(`./dist/index.html${window.location.search}${window.location.hash}`, window.location.href).toString();
  </script>
</body>
</html>
