name: Restore verified leadership and Copilot package
on:
  push:
    branches: [main]
    paths: [.github/workflows/restore-copilot-package.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}copilot-lab/
    steps:
      - uses: actions/checkout@v7
      - name: Download the verified package
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          run-id: 40629741934
          github-token: ${{ github.token }}
          path: preserved-package
      - name: Verify every file before restoring
        run: |
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path, PurePosixPath
          def digest(data):
              return {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          expected = json.loads(Path('.github/copilot-preservation.json').read_text())['files']
          expected['copilot-lab/index.html'] = digest(Path('copilot-lab/index.html').read_bytes())
          captured = {}
          with tarfile.open('preserved-package/artifact.tar') as archive:
              for member in archive.getmembers():
                  if member.isdir():
                      continue
                  name = PurePosixPath(member.name).as_posix()
                  if not member.isfile() or name not in expected or name in captured:
                      raise ValueError(f'Unexpected archive entry: {name}')
                  captured[name] = archive.extractfile(member).read()
          assert {name: digest(data) for name, data in captured.items()} == expected
          for name, data in captured.items():
              target = Path('_site') / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          print(f'All {len(captured)} files match the verified package exactly')
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
      - uses: actions/deploy-pages@v5
        id: deployment
