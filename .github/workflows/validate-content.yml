name: Validate workbook publishing
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-content.txt
      - run: python3 scripts/test_content.py
      - run: python3 scripts/build-pages.py --workbook content/Leadership_Website_Content.xlsx
